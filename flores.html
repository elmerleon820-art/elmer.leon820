<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jardín de Amor 🌸</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Georgia", serif;
  background: linear-gradient(135deg, #ffd6e7, #ffeef5, #f8d7ff);
  overflow: hidden;
}

/* Fondo flores */
.flor {
  position: absolute;
  font-size: 20px;
  animation: caer linear infinite;
  opacity: 0.8;
}

@keyframes caer {
  0% {
    transform: translateY(-10vh) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

/* Caja */
.card {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 0 30px rgba(255, 100, 200, 0.3);
}

/* Título */
h1 {
  color: #cc3366;
  font-size: 2.5rem;
}

/* Texto */
p {
  font-size: 1.2rem;
  color: #5c0040;
}

/* Botón */
button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: #ff4da6;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff80bf;
  transform: scale(1.1);
}

/* Mensaje */
.mensaje {
  display: none;
  margin-top: 15px;
  color: #99004d;
  font-style: italic;
}
</style>
</head>

<body>
  <a href="index.html">
  <button>Volver a Galaxia 🌌</button>
</a>

<div class="card">
  <h1>Jardín de Amor 🌸</h1>
  <p>
    Entre flores suaves y colores delicados,  
    florece algo bonito… algo que no se explica.
  </p>

  <button onclick="mostrar()">Descúbrelo 💌</button>

  <div class="mensaje" id="mensaje">
    Eres la flor más bonita en mi jardín. 💖
  </div>

  <br><br>
  <a href="index.html">Volver a galaxia 💫</a>
</div>

<script>
function mostrar(){
  document.getElementById("mensaje").style.display = "block";
}

// Crear flores cayendo
function crearFlor(){
  const flor = document.createElement("div");
  flor.classList.add("flor");
  flor.innerHTML = "🌸";

  flor.style.left = Math.random() * 100 + "vw";
  flor.style.fontSize = (16 + Math.random() * 30) + "px";
  flor.style.animationDuration = (5 + Math.random() * 5) + "s";

  document.body.appendChild(flor);

  setTimeout(() => {
    flor.remove();
  }, 10000);
}

setInterval(crearFlor, 300);
</script>

</body>
</html>
