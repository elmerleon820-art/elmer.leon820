<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo de Amor 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ff9ad5, #30104d 45%, #07000f);
      color: white;
    }

    .luna {
      position: absolute;
      top: 60px;
      right: 90px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff5fb, #ffb6e6, #9d5cff);
      box-shadow: 0 0 60px #ffb6e6;
      animation: flotar 4s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 680px;
      padding: 45px 35px;
      text-align: center;
      border-radius: 35px;
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 0 60px rgba(255, 90, 190, 0.45);
      animation: aparecer 1.2s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(45px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .icono {
      font-size: 55px;
      margin-bottom: 15px;
      animation: latir 1.4s infinite;
    }

    @keyframes latir {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    h1 {
      font-size: 3rem;
      color: #ffe1f3;
      text-shadow: 0 0 25px #ff4fa3;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.18rem;
      line-height: 1.8;
      color: #fff2fb;
      margin-bottom: 25px;
    }

    .frase {
      color: #ffc4e7;
      font-style: italic;
    }

    button {
      padding: 14px 36px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(45deg, #ff4fa3, #7b5cff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 0 25px rgba(255, 79, 163, 0.7);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(255, 190, 230, 0.95);
    }

    .mensaje {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 25px;
      background: rgba(255,255,255,0.16);
      color: #fff0fa;
      animation: abrir 0.8s ease;
    }

    @keyframes abrir {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .corazon {
      position: fixed;
      bottom: -40px;
      color: rgba(255, 170, 225, 0.85);
      pointer-events: none;
      animation: subir linear forwards;
    }

    @keyframes subir {
      to {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }

    .estrella {
      position: fixed;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 12px white;
      pointer-events: none;
      animation: brillar 2s ease-out forwards;
    }

    @keyframes brillar {
      to {
        transform: scale(3);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .luna {
        width: 90px;
        height: 90px;
        right: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="luna"></div>

  <div class="card">
    <div class="icono">💖</div>

    <h1>Un Universo Para Ti</h1>

    <p>
      Hay personas que no solo llegan a tu vida,
      llegan como estrellas: iluminan, acompañan y se quedan brillando.
    </p>

    <p class="frase">
      “Si el amor tuviera cielo, tú serías mi constelación favorita.”
    </p>

    <button onclick="mostrarMensaje()">Abrir sorpresa ✨</button>

    <div class="mensaje" id="mensaje">
      Eres ese detalle bonito que vuelve especial hasta el día más simple. 💌
    </div>
  </div>

  <script>
    function mostrarMensaje() {
      document.getElementById("mensaje").style.display = "block";
      explosion();
    }

    function crearCorazon() {
      const c = document.createElement("div");
      c.className = "corazon";
      c.innerHTML = "❤";
      c.style.left = Math.random() * 100 + "vw";
      c.style.fontSize = 16 + Math.random() * 32 + "px";
      c.style.animationDuration = 5 + Math.random() * 6 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 11000);
    }

    function crearEstrella() {
      const e = document.createElement("div");
      e.className = "estrella";
      e.style.left = Math.random() * 100 + "vw";
      e.style.top = Math.random() * 100 + "vh";
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 2000);
    }

    function explosion() {
      for (let i = 0; i < 20; i++) {
        setTimeout(crearCorazon, i * 40);
      }
    }

    setInterval(crearCorazon, 400);
    setInterval(crearEstrella, 250);
  </script>

</body>
</html>
